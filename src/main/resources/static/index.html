<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futsal PRO - Gestão de Atletas</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #f4f6f9; color: #333333;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow-x: hidden;
        }
        #app-scaler {
            width: 100%; max-width: 1560px; min-height: 100vh;
            display: flex; flex-direction: column; position: relative;
            padding: 10px;
        }
        @media (min-width: 768px) {
            #app-scaler { height: 900px; min-height: unset; border: 1px solid #dcdcdc; border-radius: 12px; background: #ffffff; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden; }
        }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; flex: 1; }
        .screen.active { display: flex; }

        .escaloes-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px; padding: 30px; overflow-y: auto; flex: 1;
            background-color: #f8f9fa;
        }
        .card-escalao {
            background: #ffffff; border: 1px solid #e0e0e0; border-radius: 10px;
            padding: 30px; text-align: center; cursor: pointer; transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .card-escalao:hover { border-color: #007bff; background: #fdfdfd; transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,123,255,0.1); }
        .card-escalao h3 { color: #007bff; margin: 0 0 8px 0; font-size: 1.25rem; }
        .card-escalao p { color: #666; font-size: 0.85rem; margin: 0; }

        .top-nav-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: #ffffff; border-bottom: 1px solid #e0e0e0; padding: 14px 22px;
            border-radius: 10px 10px 0 0;
        }
        .main-layout {
            display: flex; width: 100%; height: calc(100% - 65px);
            gap: 15px; padding: 15px; box-sizing: border-box; overflow: hidden;
            flex-direction: column; background-color: #f8f9fa;
        }
        .panel {
            background: #ffffff; border: 1px solid #e0e0e0;
            border-radius: 10px; display: flex; flex-direction: column; padding: 15px; flex: 1; overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        
        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px;
        }
        .panel-header h3 { margin: 0; font-size: 1.15rem; color: #222; }
        
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); z-index: 1000; justify-content: center; align-items: center;
            padding: 10px; backdrop-filter: blur(2px);
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #ffffff; border: 1px solid #dcdcdc; border-radius: 12px;
            width: 100%; max-width: 900px; max-height: 95vh; overflow-y: auto; padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15); position: relative;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px;
        }
        .modal-header h3 { margin: 0; color: #007bff; font-size: 1.25rem; }

        .form-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        .form-group { margin-bottom: 8px; }
        .form-group.full-width { grid-column: 1 / -1; }

        label { display: block; font-size: 0.82rem; color: #444; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea {
            width: 100%; padding: 10px; background-color: #fdfdfd;
            border: 1px solid #ccc; border-radius: 6px; color: #222; font-size: 0.9rem; box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus { border-color: #007bff; outline: none; background-color: #fff; box-shadow: 0 0 0 3px rgba(0,123,255,0.1); }
        textarea { resize: vertical; min-height: 80px; }
        
        .btn-action {
            width: 100%; background-color: #007bff; color: #fff;
            font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; margin-top: 20px;
            transition: background 0.2s;
        }
        .btn-action:hover { background-color: #0056b3; }
        .btn-secondary {
            background-color: #e9ecef; color: #333; border: 1px solid #ced4da;
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: 0.2s;
        }
        .btn-secondary:hover { background-color: #dde2e6; border-color: #adb5bd; }
        .btn-cancel {
            width: 100%; background-color: #f1f3f5; color: #495057;
            font-weight: bold; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin-top: 8px;
        }
        .btn-cancel:hover { background-color: #e2e6ea; }

        .filters-bar {
            display: flex; gap: 12px; margin-bottom: 15px; background: #fdfdfd;
            padding: 12px; border-radius: 8px; border: 1px solid #e0e0e0; align-items: center; flex-wrap: wrap;
        }
        .filters-bar div { flex: 1; min-width: 150px; }

        .table-container { flex: 1; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }
        table { width: 100%; border-collapse: collapse; min-width: 1250px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px 14px; text-align: left; font-size: 0.88rem; color: #333; }
        th { background-color: #f8f9fa; color: #007bff; position: sticky; top: 0; z-index: 10; font-weight: bold; border-bottom: 2px solid #dee2e6; }
        tr:hover { background-color: #f8f9fa; }
        
        tr.alerta-atleta { background-color: #fff3f3 !important; }
        .badge-alerta {
            background-color: #dc3545; color: #fff; padding: 4px 8px; border-radius: 4px;
            font-size: 0.75rem; font-weight: bold; display: inline-block;
        }

        img.avatar {
            width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid #ccc;
            transition: transform 0.25s ease-in-out, box-shadow 0.25s ease-in-out;
            cursor: pointer; transform-origin: center center;
        }
        img.avatar:hover {
            transform: scale(2.8); box-shadow: 0 8px 20px rgba(0,0,0,0.25); z-index: 100; position: relative;
        }
        
        .action-btns { display: flex; gap: 6px; }
        .btn-edit { background-color: #ffc107; color: #212529; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .btn-delete { background-color: #dc3545; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

    <div id="app-scaler">

        <div id="escalaoScreen" class="screen active">
            <div class="top-nav-bar">
                <h3 style="margin: 0; color: #007bff; font-size: 1.15rem;">Futsal PRO - Selecione o Escalão</h3>
            </div>
            <div class="escaloes-grid" id="gridEscaloes"></div>
        </div>

        <div id="dashboardScreen" class="screen">
            <div class="top-nav-bar">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button class="btn-secondary" onclick="irParaEscaloes()">⬅ Voltar Escalões</button>
                    <h3 id="tituloEscalaoAtual" style="margin: 0; color: #007bff; font-size: 1.15rem;">Escalão</h3>
                </div>
                <button class="btn-secondary" style="background-color: #007bff; color: #fff; border-color: #007bff;" onclick="abrirModalCriacao()">+ Inserir Atleta</button>
            </div>
            
            <div class="main-layout">
                <div class="panel">
                    <div class="panel-header">
                        <h3>Plantel e Gestão de Atletas</h3>
                    </div>

                    <div class="filters-bar">
                        <div>
                            <label>Filtrar por Posição:</label>
                            <select id="filtroPosicao" onchange="filtrarAtletas()">
                                <option value="">Todas as Posições</option>
                                <option value="Guarda-Redes">Guarda-Redes</option>
                                <option value="Fixo">Fixo</option>
                                <option value="Ala">Ala</option>
                                <option value="Pívot">Pívot</option>
                            </select>
                        </div>
                        <div>
                            <label>Procurar Atleta:</label>
                            <input type="text" id="filtroNome" placeholder="Nome ou número..." oninput="filtrarAtletas()">
                        </div>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Foto</th>
                                    <th>Nº</th>
                                    <th>Nome</th>
                                    <th>Posição</th>
                                    <th>Escalões</th>
                                    <th>Idade</th>
                                    <th>Cond. Física</th>
                                    <th>Avaliação</th>
                                    <th>Cansaço</th>
                                    <th>Status</th>
                                    <th>Alerta</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaAtletas"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- MODAL DO CRUD COM SELEÇÃO DE MÚLTIPLOS ESCALÕES -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="formTitle">Inserir Novo Atleta</h3>
                <button class="btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;" onclick="fecharModal()">✕</button>
            </div>
            <form id="atletaForm">
                <input type="hidden" id="atletaId">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nome Completo:</label>
                        <input type="text" id="nome" required placeholder="Ex: Nome do Atleta">
                    </div>
                    <div class="form-group">
                        <label>Posição:</label>
                        <select id="posicao">
                            <option value="Guarda-Redes">Guarda-Redes</option>
                            <option value="Fixo">Fixo</option>
                            <option value="Ala">Ala</option>
                            <option value="Pívot">Pívot</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Escalão Principal:</label>
                        <select id="escalaoPrincipal" required>
                            <option value="Petrizes">Petrizes</option>
                            <option value="Traquinas">Traquinas</option>
                            <option value="Benjamins">Benjamins</option>
                            <option value="Infantis">Infantis</option>
                            <option value="Iniciados">Iniciados</option>
                            <option value="Juvenis">Juvenis</option>
                            <option value="Juniores">Juniores</option>
                            <option value="Seniores">Seniores</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Escalão Secundário (Opcional):</label>
                        <select id="escalaoSecundario">
                            <option value="">Nenhum</option>
                            <option value="Petrizes">Petrizes</option>
                            <option value="Traquinas">Traquinas</option>
                            <option value="Benjamins">Benjamins</option>
                            <option value="Infantis">Infantis</option>
                            <option value="Iniciados">Iniciados</option>
                            <option value="Juvenis">Juvenis</option>
                            <option value="Juniores">Juniores</option>
                            <option value="Seniores">Seniores</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nº Camisola:</label>
                        <input type="number" id="numeroAtleta" placeholder="Ex: 14">
                    </div>
                    <div class="form-group">
                        <label>Idade:</label>
                        <input type="number" id="idade" placeholder="Ex: 16">
                    </div>
                    <div class="form-group">
                        <label>Altura (m):</label>
                        <input type="number" step="0.01" id="altura" placeholder="Ex: 1.75">
                    </div>
                    <div class="form-group">
                        <label>Peso (kg):</label>
                        <input type="number" step="0.1" id="peso" placeholder="Ex: 68.5">
                    </div>
                    <div class="form-group">
                        <label>Telemóvel:</label>
                        <input type="text" id="telemovel" placeholder="912345678">
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="email" placeholder="atleta@email.com">
                    </div>
                    <div class="form-group">
                        <label>Status:</label>
                        <select id="status">
                            <option value="Disponivel">Disponível</option>
                            <option value="Lesionado">Lesionado</option>
                            <option value="Ausente">Ausente</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Condição Física:</label>
                        <input type="text" id="condicaoFisica" placeholder="Ex: 45 ou 80%">
                    </div>

                    <div class="form-group">
                        <label>Avaliação:</label>
                        <select id="avaliacao">
                            <option value="Excelente">Excelente</option>
                            <option value="Bom">Bom</option>
                            <option value="Regular">Regular</option>
                            <option value="Insuficiente">Insuficiente</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nível de Cansaço:</label>
                        <select id="nivelCansaco">
                            <option value="Baixo">Baixo</option>
                            <option value="Moderado">Moderado</option>
                            <option value="Elevado">Elevado</option>
                            <option value="Exausto">Exausto</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Descanso:</label>
                        <select id="descanso">
                            <option value="Adequado">Adequado</option>
                            <option value="Insuficiente">Insuficiente</option>
                            <option value="Perturbado">Perturbado</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Alimentação:</label>
                        <select id="alimentacao">
                            <option value="Regrada / Saudável">Regrada / Saudável</option>
                            <option value="Razoável">Razoável</option>
                            <option value="Desregulada">Desregulada</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Aproveitamento Escolar:</label>
                        <select id="aproveitamentoEscolar">
                            <option value="Muito Bom">Muito Bom</option>
                            <option value="Bom">Bom</option>
                            <option value="Suficiente">Suficiente</option>
                            <option value="Em Risco / Insuficiente">Em Risco / Insuficiente</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Fotografia:</label>
                        <input type="file" id="fotoInput" accept="image/*" style="padding: 5px; background: #fff; border: 1px solid #ccc; border-radius: 5px; color: #333; font-size: 0.85rem;">
                    </div>

                    <div class="form-group full-width">
                        <label>Encarregado de Educação (EE) / Contato:</label>
                        <input type="text" id="encarregadoEducacao" placeholder="Nome e Telemóvel do EE">
                    </div>

                    <div class="form-group full-width">
                        <label>Observações:</label>
                        <textarea id="observacoes" placeholder="Notas importantes..."></textarea>
                    </div>
                </div>

                <button type="submit" id="btnSubmit" class="btn-action">Guardar Atleta</button>
                <button type="button" class="btn-cancel" onclick="fecharModal()">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api/atletas';
        let atletasCache = [];
        let escalaoSelecionado = '';

        const escaloesLista = [
            "Petrizes", "Traquinas", "Benjamins", "Infantis", 
            "Iniciados", "Juvenis", "Juniores", "Seniores"
        ];

        window.addEventListener("DOMContentLoaded", () => {
            carregarEscaloesUI();
        });

        function carregarEscaloesUI() {
            const grid = document.getElementById('gridEscaloes');
            grid.innerHTML = '';
            escaloesLista.forEach(esc => {
                const div = document.createElement('div');
                div.className = 'card-escalao';
                div.onclick = () => selecionarEscalao(esc);
                div.innerHTML = `
                    <h3>${esc}</h3>
                    <p>Gerir plantel e atletas</p>
                `;
                grid.appendChild(div);
            });
        }

        function irParaEscaloes() {
            mudarEcras('escalaoScreen');
        }

        function selecionarEscalao(escalao) {
            escalaoSelecionado = escalao;
            document.getElementById('tituloEscalaoAtual').innerText = `Escalão: ${escalao}`;
            mudarEcras('dashboardScreen');
            carregarAtletas();
        }

        function mudarEcras(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function abrirModalCriacao() {
            document.getElementById('atletaForm').reset();
            document.getElementById('atletaId').value = '';
            document.getElementById('formTitle').innerText = 'Inserir Novo Atleta';
            document.getElementById('btnSubmit').innerText = 'Guardar Atleta';
            document.getElementById('modalOverlay').classList.add('active');
        }

        function fecharModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        const getBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        async function carregarAtletas() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Erro na resposta da API');
                const todos = await response.json();
                
                // Lógica principal: Verifica se o escalão selecionado está presente na string "escaloes" do atleta
                atletasCache = todos.filter(a => {
                    if (!a.escaloes) return false;
                    const listaEscaloes = a.escaloes.split(',').map(e => e.trim());
                    return listaEscaloes.includes(escalaoSelecionado);
                });

                renderizarTabela(atletasCache);
            } catch (error) {
                console.error('Erro ao carregar atletas:', error);
            }
        }

        function renderizarTabela(atletas) {
            const tbody = document.getElementById('tabelaAtletas');
            tbody.innerHTML = '';

            if (atletas.length === 0) {
                tbody.innerHTML = `<tr><td colspan="12" style="text-align: center; color: #777; padding: 25px;">Nenhum atleta registado neste escalão.</td></tr>`;
                return;
            }

            atletas.forEach(a => {
                let condFisicaNum = parseInt(String(a.condicaoFisica || "").replace(/[^0-9]/g, '')) || 100;
                let cansaco = (a.nivelCansaco || "").trim();
                let precisaAvaliar = (condFisicaNum < 50) || (cansaco === 'Elevado' || cansaco === 'Exausto');

                const tr = document.createElement('tr');
                if (precisaAvaliar) {
                    tr.className = 'alerta-atleta';
                }

                tr.innerHTML = `
                    <td>${a.fotoBase64 ? `<img src="${a.fotoBase64}" class="avatar">` : '<span style="color:#aaa;">Sem foto</span>'}</td>
                    <td><span style="color: #007bff; font-weight: bold;">${a.numeroAtleta || '-'}</span></td>
                    <td>${a.nome || ''}</td>
                    <td>${a.posicao || ''}</td>
                    <td><span style="color: #495057; font-weight: bold; font-size: 0.8rem;">${a.escaloes || '-'}</span></td>
                    <td>${a.idade || '-'}</td>
                    <td><span style="font-weight: bold; color: ${condFisicaNum < 50 ? '#d9534f' : '#333'};">${a.condicaoFisica || '-'}</span></td>
                    <td>${a.avaliacao || '-'}</td>
                    <td><span style="color: ${cansaco === 'Elevado' || cansaco === 'Exausto' ? '#d9534f' : '#28a745'}; font-weight: bold;">${cansaco || '-'}</span></td>
                    <td><span style="color: ${a.status === 'Disponivel' ? '#28a745' : '#d9534f'}; font-weight: bold;">${a.status || ''}</span></td>
                    <td>${precisaAvaliar ? `<span class="badge-alerta">⚠️ Avaliar Atleta</span>` : '<span style="color: #28a745; font-size: 0.8rem;">Normal</span>'}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-edit" onclick="prepararEdicao(${a.id})">Editar</button>
                            <button class="btn-delete" onclick="eliminarAtleta(${a.id})">Eliminar</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarAtletas() {
            const posFiltro = document.getElementById('filtroPosicao').value;
            const nomeFiltro = document.getElementById('filtroNome').value.toLowerCase();

            const filtrados = atletasCache.filter(a => {
                const matchPos = posFiltro === "" || a.posicao === posFiltro;
                const matchNome = (a.nome || '').toLowerCase().includes(nomeFiltro) || 
                                  String(a.numeroAtleta || '').includes(nomeFiltro);
                return matchPos && matchNome;
            });

            renderizarTabela(filtrados);
        }

        document.getElementById('atletaForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('atletaId').value;
            let fotoBase64 = null;
            const fileInput = document.getElementById('fotoInput').files[0];
            
            if (fileInput) {
                fotoBase64 = await getBase64(fileInput);
            } else if (id) {
                const atletaExistente = atletasCache.find(a => a.id == id);
                if (atletaExistente) fotoBase64 = atletaExistente.fotoBase64;
            }

            const escPrincipal = document.getElementById('escalaoPrincipal').value;
            const escSecundario = document.getElementById('escalaoSecundario').value;
            
            // Combina os escalões separados por vírgula se o secundário estiver preenchido
            let escaloesCombinados = escPrincipal;
            if (escSecundario && escSecundario !== "") {
                escaloesCombinados = `${escPrincipal}, ${escSecundario}`;
            }

            const atleta = {
                nome: document.getElementById('nome').value,
                posicao: document.getElementById('posicao').value,
                escaloes: escaloesCombinados,
                numeroAtleta: parseInt(document.getElementById('numeroAtleta').value) || null,
                idade: parseInt(document.getElementById('idade').value) || null,
                altura: parseFloat(document.getElementById('altura').value) || null,
                peso: parseFloat(document.getElementById('peso').value) || null,
                telemovel: document.getElementById('telemovel').value,
                email: document.getElementById('email').value,
                status: document.getElementById('status').value,
                condicaoFisica: document.getElementById('condicaoFisica').value,
                encarregadoEducacao: document.getElementById('encarregadoEducacao').value,
                avaliacao: document.getElementById('avaliacao').value,
                nivelCansaco: document.getElementById('nivelCansaco').value,
                descanso: document.getElementById('descanso').value,
                alimentacao: document.getElementById('alimentacao').value,
                aproveitamentoEscolar: document.getElementById('aproveitamentoEscolar').value,
                observacoes: document.getElementById('observacoes').value,
                fotoBase64: fotoBase64
            };

            const url = id ? `${API_URL}/${id}` : API_URL;
            const method = id ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(atleta)
            });

            if (response.ok) {
                fecharModal();
                carregarAtletas();
            } else {
                alert('Erro ao guardar o atleta na base de dados.');
            }
        });

        function prepararEdicao(id) {
            const atleta = atletasCache.find(a => a.id === id);
            if (!atleta) return;

            document.getElementById('atletaId').value = atleta.id;
            document.getElementById('nome').value = atleta.nome || '';
            document.getElementById('posicao').value = atleta.posicao || 'Ala';
            
            // Separar os escalões gravados para preencher os selects do formulário
            if (atleta.escaloes) {
                const partes = atleta.escaloes.split(',').map(e => e.trim());
                document.getElementById('escalaoPrincipal').value = partes[0] || 'Petrizes';
                document.getElementById('escalaoSecundario').value = partes[1] || '';
            }

            document.getElementById('numeroAtleta').value = atleta.numeroAtleta || '';
            document.getElementById('idade').value = atleta.idade || '';
            document.getElementById('altura').value = atleta.altura || '';
            document.getElementById('peso').value = atleta.peso || '';
            document.getElementById('telemovel').value = atleta.telemovel || '';
            document.getElementById('email').value = atleta.email || '';
            document.getElementById('status').value = atleta.status || 'Disponivel';
            document.getElementById('condicaoFisica').value = atleta.condicaoFisica || '';
            document.getElementById('encarregadoEducacao').value = atleta.encarregadoEducacao || '';
            
            document.getElementById('avaliacao').value = atleta.avaliacao || 'Bom';
            document.getElementById('nivelCansaco').value = atleta.nivelCansaco || 'Moderado';
            document.getElementById('descanso').value = atleta.descanso || 'Adequado';
            document.getElementById('alimentacao').value = atleta.alimentacao || 'Regrada / Saudável';
            document.getElementById('aproveitamentoEscolar').value = atleta.aproveitamentoEscolar || 'Bom';
            document.getElementById('observacoes').value = atleta.observacoes || '';

            document.getElementById('formTitle').innerText = 'Editar Atleta';
            document.getElementById('btnSubmit').innerText = 'Atualizar Atleta';
            document.getElementById('modalOverlay').classList.add('active');
        }

        async function eliminarAtleta(id) {
            if (confirm('Tens a certeza que pretendes eliminar este atleta?')) {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    carregarAtletas();
                } else {
                    alert('Erro ao eliminar o atleta.');
                }
            }
        }
    </script>
</body>
</html>
