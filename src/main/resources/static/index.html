<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futsal PRO - Gestão de Atletas</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #121212; color: #e0e0e0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow-x: hidden;
        }
        #app-scaler {
            width: 100%; max-width: 1400px; min-height: 100vh;
            display: flex; flex-direction: column; position: relative;
            padding: 10px;
        }
        @media (min-width: 768px) {
            #app-scaler { height: 850px; min-height: unset; border: 1px solid #333; border-radius: 10px; background: #181818; overflow: hidden; }
        }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; flex: 1; }
        .screen.active { display: flex; }

        .escaloes-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px; padding: 25px; overflow-y: auto; flex: 1;
        }
        .card-escalao {
            background: #1a1a1a; border: 1px solid #333; border-radius: 10px;
            padding: 30px; text-align: center; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .card-escalao:hover { border-color: #00ffcc; background: #222; transform: translateY(-3px); }
        .card-escalao h3 { color: #00ffcc; margin: 0 0 8px 0; font-size: 1.2rem; }
        .card-escalao p { color: #888; font-size: 0.85rem; margin: 0; }

        .top-nav-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: #1a1a1a; border-bottom: 1px solid #333; padding: 12px 20px;
            border-radius: 8px 8px 0 0;
        }
        .main-layout {
            display: flex; width: 100%; height: calc(100% - 60px);
            gap: 15px; padding: 15px; box-sizing: border-box; overflow: hidden;
            flex-direction: column;
        }
        .panel {
            background: #1a1a1a; border: 1px solid #333;
            border-radius: 8px; display: flex; flex-direction: column; padding: 15px; flex: 1; overflow: hidden;
        }
        
        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px;
        }
        .panel-header h3 { margin: 0; font-size: 1.1rem; color: #00ffcc; }
        
        /* Modal Expandido e Totalmente Responsivo */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center;
            padding: 10px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #1a1a1a; border: 1px solid #00ffcc; border-radius: 10px;
            width: 100%; max-width: 850px; max-height: 95vh; overflow-y: auto; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); position: relative;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 8px;
        }
        .modal-header h3 { margin: 0; color: #00ffcc; font-size: 1.15rem; }

        .form-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
        }
        .form-group { margin-bottom: 10px; }
        .form-group.full-width { grid-column: 1 / -1; }

        label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 4px; }
        input, select, textarea {
            width: 100%; padding: 9px; background-color: #252525;
            border: 1px solid #444; border-radius: 5px; color: #fff; font-size: 0.9rem; box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus { border-color: #00ffcc; outline: none; }
        textarea { resize: vertical; min-height: 70px; }
        
        .btn-action {
            width: 100%; background-color: #00ffcc; color: #000;
            font-weight: bold; padding: 11px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.95rem; margin-top: 15px;
        }
        .btn-action:hover { background-color: #00cca3; }
        .btn-secondary {
            background-color: #333; color: #fff; border: 1px solid #444;
            padding: 8px 14px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: 0.2s;
        }
        .btn-secondary:hover { background-color: #444; border-color: #00ffcc; }
        .btn-cancel {
            width: 100%; background-color: #2a2a2a; color: #aaa;
            font-weight: bold; padding: 9px; border: 1px solid #444; border-radius: 5px; cursor: pointer; font-size: 0.85rem; margin-top: 6px;
        }
        .btn-cancel:hover { background-color: #333; color: #fff; }

        .filters-bar {
            display: flex; gap: 10px; margin-bottom: 12px; background: #141414;
            padding: 10px; border-radius: 6px; border: 1px solid #333; align-items: center; flex-wrap: wrap;
        }
        .filters-bar div { flex: 1; min-width: 140px; }

        .table-container { flex: 1; overflow-y: auto; border: 1px solid #333; border-radius: 6px; background: #111; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th, td { border-bottom: 1px solid #222; padding: 12px; text-align: left; font-size: 0.85rem; }
        th { background-color: #1a1a1a; color: #00ffcc; position: sticky; top: 0; z-index: 1; }
        img.avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1px solid #00ffcc; }
        
        .action-btns { display: flex; gap: 6px; }
        .btn-edit { background-color: #ffc107; color: #000; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.78rem; font-weight: bold; }
        .btn-delete { background-color: #dc3545; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.78rem; font-weight: bold; }
    </style>
</head>
<body>

    <div id="app-scaler">

        <!-- 1. ECRÃ DE SELEÇÃO DE ESCALÃO -->
        <div id="escalaoScreen" class="screen active">
            <div class="top-nav-bar">
                <h3 style="margin: 0; color: #00ffcc; font-size: 1.1rem;">Futsal PRO - Selecione o Escalão</h3>
            </div>
            <div class="escaloes-grid" id="gridEscaloes"></div>
        </div>

        <!-- 2. ECRÃ DE GESTÃO DE ATLETAS -->
        <div id="dashboardScreen" class="screen">
            <div class="top-nav-bar">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button class="btn-secondary" onclick="irParaEscaloes()">⬅ Voltar Escalões</button>
                    <h3 id="tituloEscalaoAtual" style="margin: 0; color: #00ffcc; font-size: 1.1rem;">Escalão</h3>
                </div>
                <button class="btn-secondary" style="background-color: #00ffcc; color: #000; border-color: #00ffcc;" onclick="abrirModalCriacao()">+ Inserir Atleta</button>
            </div>
            
            <div class="main-layout">
                <div class="panel">
                    <div class="panel-header">
                        <h3>Plantel e Gestão de Atletas</h3>
                    </div>

                    <div class="filters-bar">
                        <div>
                            <label>Filtrar por Posição:</label>
                            <select id="filtroPosicao" onchange="filtrarAtletas()">
                                <option value="">Todas as Posições</option>
                                <option value="Guarda-Redes">Guarda-Redes</option>
                                <option value="Fixo">Fixo</option>
                                <option value="Ala">Ala</option>
                                <option value="Pívot">Pívot</option>
                            </select>
                        </div>
                        <div>
                            <label>Procurar Atleta:</label>
                            <input type="text" id="filtroNome" placeholder="Nome ou número..." oninput="filtrarAtletas()">
                        </div>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Foto</th>
                                    <th>Nº</th>
                                    <th>Nome</th>
                                    <th>Posição</th>
                                    <th>Avaliação</th>
                                    <th>Cansaço</th>
                                    <th>Escola</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaAtletas"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- MODAL DO CRUD EXPANDIDO (Com seleções e observações) -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="formTitle">Inserir Novo Atleta</h3>
                <button class="btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="fecharModal()">✕</button>
            </div>
            <form id="atletaForm">
                <input type="hidden" id="atletaId">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nome Completo:</label>
                        <input type="text" id="nome" required placeholder="Ex: Nome do Atleta">
                    </div>
                    <div class="form-group">
                        <label>Posição:</label>
                        <select id="posicao">
                            <option value="Guarda-Redes">Guarda-Redes</option>
                            <option value="Fixo">Fixo</option>
                            <option value="Ala">Ala</option>
                            <option value="Pívot">Pívot</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nº Camisola:</label>
                        <input type="number" id="numeroAtleta" placeholder="Ex: 14">
                    </div>
                    <div class="form-group">
                        <label>Idade:</label>
                        <input type="number" id="idade" placeholder="Ex: 16">
                    </div>
                    <div class="form-group">
                        <label>Altura (m):</label>
                        <input type="number" step="0.01" id="altura" placeholder="Ex: 1.75">
                    </div>
                    <div class="form-group">
                        <label>Peso (kg):</label>
                        <input type="number" step="0.1" id="peso" placeholder="Ex: 68.5">
                    </div>
                    <div class="form-group">
                        <label>Telemóvel:</label>
                        <input type="text" id="telemovel" placeholder="912345678">
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="email" placeholder="atleta@email.com">
                    </div>
                    <div class="form-group">
                        <label>Status:</label>
                        <select id="status">
                            <option value="Disponivel">Disponível</option>
                            <option value="Lesionado">Lesionado</option>
                            <option value="Ausente">Ausente</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Condição Física:</label>
                        <input type="text" id="condicaoFisica" placeholder="Ex: 100%">
                    </div>

                    <!-- NOVOS CAMPOS POR ESCOLHA -->
                    <div class="form-group">
                        <label>Avaliação:</label>
                        <select id="avaliacao">
                            <option value="Excelente">Excelente</option>
                            <option value="Bom">Bom</option>
                            <option value="Regular">Regular</option>
                            <option value="Insuficiente">Insuficiente</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nível de Cansaço:</label>
                        <select id="nivelCansaco">
                            <option value="Baixo">Baixo</option>
                            <option value="Moderado">Moderado</option>
                            <option value="Elevado">Elevado</option>
                            <option value="Exausto">Exausto</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Descanso:</label>
                        <select id="descanso">
                            <option value="Adequado">Adequado</option>
                            <option value="Insuficiente">Insuficiente</option>
                            <option value="Perturbado">Perturbado</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Alimentação:</label>
                        <select id="alimentacao">
                            <option value="Regrada / Saudável">Regrada / Saudável</option>
                            <option value="Razoável">Razoável</option>
                            <option value="Desregulada">Desregulada</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Aproveitamento Escolar:</label>
                        <select id="aproveitamentoEscolar">
                            <option value="Muito Bom">Muito Bom</option>
                            <option value="Bom">Bom</option>
                            <option value="Suficiente">Suficiente</option>
                            <option value="Em Risco / Insuficiente">Em Risco / Insuficiente</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Fotografia:</label>
                        <input type="file" id="fotoInput" accept="image/*" style="padding: 5px; background: #252525; border: 1px solid #444; border-radius: 5px; color: #fff; font-size: 0.85rem;">
                    </div>

                    <div class="form-group full-width">
                        <label>Encarregado de Educação (EE) / Contato:</label>
                        <input type="text" id="encarregadoEducacao" placeholder="Nome e Telemóvel do EE">
                    </div>

                    <div class="form-group full-width">
                        <label>Observações:</label>
                        <textarea id="observacoes" placeholder="Notas importantes sobre o rendimento, comportamento ou aspetos médicos..."></textarea>
                    </div>
                </div>

                <button type="submit" id="btnSubmit" class="btn-action">Guardar Atleta</button>
                <button type="button" class="btn-cancel" onclick="fecharModal()">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api/atletas';
        let atletasCache = [];
        let escalaoSelecionado = '';

        const escaloesLista = [
            "Petizes", "Traquinas", "Benjamins", "Infantis", 
            "Iniciados", "Juvenis", "Juniores", "Seniores"
        ];

        window.addEventListener("DOMContentLoaded", () => {
            carregarEscaloesUI();
        });

        function carregarEscaloesUI() {
            const grid = document.getElementById('gridEscaloes');
            grid.innerHTML = '';
            escaloesLista.forEach(esc => {
                const div = document.createElement('div');
                div.className = 'card-escalao';
                div.onclick = () => selecionarEscalao(esc);
                div.innerHTML = `
                    <h3>${esc}</h3>
                    <p>Gerir plantel e atletas</p>
                `;
                grid.appendChild(div);
            });
        }

        function irParaEscaloes() {
            mudarEcras('escalaoScreen');
        }

        function selecionarEscalao(escalao) {
            escalaoSelecionado = escalao;
            document.getElementById('tituloEscalaoAtual').innerText = `Escalão: ${escalao}`;
            mudarEcras('dashboardScreen');
            carregarAtletas();
        }

        function mudarEcras(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function abrirModalCriacao() {
            document.getElementById('atletaForm').reset();
            document.getElementById('atletaId').value = '';
            document.getElementById('formTitle').innerText = 'Inserir Novo Atleta';
            document.getElementById('btnSubmit').innerText = 'Guardar Atleta';
            document.getElementById('modalOverlay').classList.add('active');
        }

        function fecharModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        const getBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        async function carregarAtletas() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Erro na resposta da API');
                const todos = await response.json();
                atletasCache = todos.filter(a => a.escalao === escalaoSelecionado);
                renderizarTabela(atletasCache);
            } catch (error) {
                console.error('Erro ao carregar atletas:', error);
            }
        }

        function renderizarTabela(atletas) {
            const tbody = document.getElementById('tabelaAtletas');
            tbody.innerHTML = '';

            if (atletas.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: #777; padding: 20px;">Nenhum atleta registado neste escalão.</td></tr>`;
                return;
            }

            atletas.forEach(a => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${a.fotoBase64 ? `<img src="${a.fotoBase64}" class="avatar">` : '<span style="color:#555;">Sem foto</span>'}</td>
                    <td><span style="color: #ffcc00; font-weight: bold;">${a.numeroAtleta || '-'}</span></td>
                    <td>${a.nome || ''}</td>
                    <td>${a.posicao || ''}</td>
                    <td>${a.avaliacao || '-'}</td>
                    <td><span style="color: ${a.nivelCansaco === 'Elevado' || a.nivelCansaco === 'Exausto' ? '#ff5555' : '#00ffcc'};">${a.nivelCansaco || '-'}</span></td>
                    <td>${a.aproveitamentoEscolar || '-'}</td>
                    <td><span style="color: ${a.status === 'Disponivel' ? '#00ffcc' : '#ff5555'}; font-weight: bold;">${a.status || ''}</span></td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-edit" onclick="prepararEdicao(${a.id})">Editar</button>
                            <button class="btn-delete" onclick="eliminarAtleta(${a.id})">Eliminar</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarAtletas() {
            const posFiltro = document.getElementById('filtroPosicao').value;
            const nomeFiltro = document.getElementById('filtroNome').value.toLowerCase();

            const filtrados = atletasCache.filter(a => {
                const matchPos = posFiltro === "" || a.posicao === posFiltro;
                const matchNome = (a.nome || '').toLowerCase().includes(nomeFiltro) || 
                                  String(a.numeroAtleta || '').includes(nomeFiltro);
                return matchPos && matchNome;
            });

            renderizarTabela(filtrados);
        }

        document.getElementById('atletaForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('atletaId').value;
            let fotoBase64 = null;
            const fileInput = document.getElementById('fotoInput').files[0];
            
            if (fileInput) {
                fotoBase64 = await getBase64(fileInput);
            } else if (id) {
                const atletaExistente = atletasCache.find(a => a.id == id);
                if (atletaExistente) fotoBase64 = atletaExistente.fotoBase64;
            }

            const atleta = {
                nome: document.getElementById('nome').value,
                posicao: document.getElementById('posicao').value,
                escalao: escalaoSelecionado,
                numeroAtleta: parseInt(document.getElementById('numeroAtleta').value) || null,
                idade: parseInt(document.getElementById('idade').value) || null,
                altura: parseFloat(document.getElementById('altura').value) || null,
                peso: parseFloat(document.getElementById('peso').value) || null,
                telemovel: document.getElementById('telemovel').value,
                email: document.getElementById('email').value,
                status: document.getElementById('status').value,
                condicaoFisica: document.getElementById('condicaoFisica').value,
                encarregadoEducacao: document.getElementById('encarregadoEducacao').value,
                avaliacao: document.getElementById('avaliacao').value,
                nivelCansaco: document.getElementById('nivelCansaco').value,
                descanso: document.getElementById('descanso').value,
                alimentacao: document.getElementById('alimentacao').value,
                aproveitamentoEscolar: document.getElementById('aproveitamentoEscolar').value,
                observacoes: document.getElementById('observacoes').value,
                fotoBase64: fotoBase64
            };

            const url = id ? `${API_URL}/${id}` : API_URL;
            const method = id ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(atleta)
            });

            if (response.ok) {
                fecharModal();
                carregarAtletas();
            } else {
                alert('Erro ao guardar o atleta na base de dados.');
            }
        });

        function prepararEdicao(id) {
            const atleta = atletasCache.find(a => a.id === id);
            if (!atleta) return;

            document.getElementById('atletaId').value = atleta.id;
            document.getElementById('nome').value = atleta.nome || '';
            document.getElementById('posicao').value = atleta.posicao || 'Ala';
            document.getElementById('numeroAtleta').value = atleta.numeroAtleta || '';
            document.getElementById('idade').value = atleta.idade || '';
            document.getElementById('altura').value = atleta.altura || '';
            document.getElementById('peso').value = atleta.peso || '';
            document.getElementById('telemovel').value = atleta.telemovel || '';
            document.getElementById('email').value = atleta.email || '';
            document.getElementById('status').value = atleta.status || 'Disponivel';
            document.getElementById('condicaoFisica').value = atleta.condicaoFisica || '';
            document.getElementById('encarregadoEducacao').value = atleta.encarregadoEducacao || '';
            document.getElementById('avaliacao').value = atleta.avaliacao || 'Bom';
            document.getElementById('nivelCansaco').value = atleta.nivelCansaco || 'Moderado';
            document.getElementById('descanso').value = atleta.descanso || 'Adequado';
            document.getElementById('alimentacao').value = atleta.alimentacao || 'Regrada / Saudável';
            document.getElementById('aproveitamentoEscolar').value = atleta.aproveitamentoEscolar || 'Bom';
            document.getElementById('observacoes').value = atleta.observacoes || '';

            document.getElementById('formTitle').innerText = 'Editar Atleta';
            document.getElementById('btnSubmit').innerText = 'Atualizar Atleta';
            document.getElementById('modalOverlay').classList.add('active');
        }

        async function eliminarAtleta(id) {
            if (confirm('Tens a certeza que pretendes eliminar este atleta?')) {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    carregarAtletas();
                } else {
                    alert('Erro ao eliminar o atleta.');
                }
            }
        }
    </script>
</body>
</html>
