<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futsal PRO - Gestão de Atletas</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #121212; color: #e0e0e0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow-x: hidden;
        }
        #app-scaler {
            width: 100%; max-width: 1280px; min-height: 100vh;
            display: flex; flex-direction: column; position: relative;
            padding: 10px;
        }
        @media (min-width: 768px) {
            #app-scaler { height: 720px; min-height: unset; border: 1px solid #333; border-radius: 10px; background: #181818; overflow: hidden; }
        }

        /* Ecrãs de Navegação */
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; flex: 1; }
        .screen.active { display: flex; }

        /* Seleção de Escalões */
        .escaloes-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px; padding: 20px; overflow-y: auto; flex: 1;
        }
        .card-escalao {
            background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
            padding: 25px; text-align: center; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .card-escalao:hover { border-color: #00ffcc; background: #222; transform: translateY(-3px); }
        .card-escalao h3 { color: #00ffcc; margin: 0 0 5px 0; }
        .card-escalao p { color: #888; font-size: 0.85rem; margin: 0; }

        /* Top Nav & Layout Principal */
        .top-nav-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: #1a1a1a; border-bottom: 1px solid #333; padding: 10px 15px;
            border-radius: 6px 6px 0 0;
        }
        .main-layout {
            display: flex; width: 100%; height: calc(100% - 55px);
            gap: 10px; padding: 10px; box-sizing: border-box; overflow: hidden;
            flex-direction: column;
        }
        @media (min-width: 992px) {
            .main-layout { flex-direction: row; }
        }
        .panel {
            background: #1a1a1a; border: 1px solid #333;
            border-radius: 8px; display: flex; flex-direction: column; padding: 12px;
        }
        .left-panel { flex: 1.2; overflow-y: auto; display: none; }
        .left-panel.active { display: flex; }
        .right-panel { flex: 2.8; overflow: hidden; }
        
        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 6px;
        }
        .panel-header h3 { margin: 0; font-size: 1rem; color: #00ffcc; }
        
        form div { margin-bottom: 8px; }
        label { display: block; font-size: 0.78rem; color: #aaa; margin-bottom: 3px; }
        input, select {
            width: 100%; padding: 8px; background-color: #252525;
            border: 1px solid #444; border-radius: 5px; color: #fff; font-size: 0.85rem; box-sizing: border-box;
        }
        input:focus, select:focus { border-color: #00ffcc; outline: none; }
        
        .btn-action {
            width: 100%; background-color: #00ffcc; color: #000;
            font-weight: bold; padding: 9px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.9rem; margin-top: 5px;
        }
        .btn-action:hover { background-color: #00cca3; }
        .btn-secondary {
            background-color: #444; color: #fff; border: none;
            padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.85rem;
        }
        .btn-secondary:hover { background-color: #555; }
        .btn-cancel {
            width: 100%; background-color: #333; color: #fff;
            font-weight: bold; padding: 6px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.8rem; margin-top: 4px; display: none;
        }

        .filters-bar {
            display: flex; gap: 8px; margin-bottom: 10px; background: #141414;
            padding: 8px; border-radius: 6px; border: 1px solid #333; align-items: center; flex-wrap: wrap;
        }
        .filters-bar div { flex: 1; min-width: 120px; }

        .table-container { flex: 1; overflow-y: auto; border: 1px solid #333; border-radius: 6px; background: #111; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { border-bottom: 1px solid #222; padding: 10px; text-align: left; font-size: 0.85rem; }
        th { background-color: #1a1a1a; color: #00ffcc; position: sticky; top: 0; z-index: 1; }
        img.avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid #00ffcc; }
        
        .action-btns { display: flex; gap: 6px; }
        .btn-edit { background-color: #ffc107; color: #000; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
        .btn-delete { background-color: #dc3545; color: #fff; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
    </style>
</head>
<body>

    <div id="app-scaler">

        <!-- 1. ECRÃ DE SELEÇÃO DE ESCALÃO (Página Inicial) -->
        <div id="escalaoScreen" class="screen active">
            <div class="top-nav-bar">
                <h3 style="margin: 0; color: #00ffcc; font-size: 1rem;">Futsal PRO - Selecione o Escalão</h3>
            </div>
            <div class="escaloes-grid" id="gridEscaloes">
                <!-- Preenchido via JS dinamicamente -->
            </div>
        </div>

        <!-- 2. ECRÃ DE GESTÃO DE ATLETAS -->
        <div id="dashboardScreen" class="screen">
            <div class="top-nav-bar">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button class="btn-secondary" onclick="irParaEscaloes()">⬅ Voltar Escalões</button>
                    <h3 id="tituloEscalaoAtual" style="margin: 0; color: #00ffcc; font-size: 1rem;">Escalão</h3>
                </div>
                <button class="btn-secondary" style="background-color: #00ffcc; color: #000;" onclick="toggleFormulario()">+ Inserir Atleta</button>
            </div>
            
            <div class="main-layout">
                <!-- Painel Esquerdo: Formulário Oculto / Visível -->
                <div class="panel left-panel" id="formPanel">
                    <div class="panel-header">
                        <h3 id="formTitle">Inserir Novo Atleta</h3>
                    </div>
                    <form id="atletaForm">
                        <input type="hidden" id="atletaId">
                        <div><label>Nome:</label><input type="text" id="nome" required></div>
                        <div>
                            <label>Posição:</label>
                            <select id="posicao">
                                <option value="Guarda-Redes">Guarda-Redes</option>
                                <option value="Fixo">Fixo</option>
                                <option value="Ala">Ala</option>
                                <option value="Pívot">Pívot</option>
                            </select>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <div style="flex: 1;"><label>Nº Atleta:</label><input type="number" id="numeroAtleta"></div>
                            <div style="flex: 1;"><label>Idade:</label><input type="number" id="idade"></div>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <div style="flex: 1;"><label>Altura (m):</label><input type="number" step="0.01" id="altura"></div>
                            <div style="flex: 1;"><label>Peso (kg):</label><input type="number" step="0.1" id="peso"></div>
                        </div>
                        <div><label>Telemóvel:</label><input type="text" id="telemovel"></div>
                        <div><label>Email:</label><input type="email" id="email"></div>
                        <div style="display: flex; gap: 8px;">
                            <div style="flex: 1;">
                                <label>Status:</label>
                                <select id="status">
                                    <option value="Disponivel">Disponível</option>
                                    <option value="Lesionado">Lesionado</option>
                                    <option value="Ausente">Ausente</option>
                                </select>
                            </div>
                            <div style="flex: 1;"><label>Cond. Física:</label><input type="text" id="condicaoFisica" placeholder="Ex: 100%"></div>
                        </div>
                        <div><label>Encarregado de Educação (EE):</label><input type="text" id="encarregadoEducacao"></div>
                        <div><label>Telemóvel EE:</label><input type="text" id="telemovelEE"></div>
                        <div>
                            <label>Foto:</label>
                            <input type="file" id="fotoInput" accept="image/*" style="padding: 4px; background: #252525; border: 1px solid #444; border-radius: 5px; color: #fff; font-size: 0.8rem;">
                        </div>
                        <button type="submit" id="btnSubmit" class="btn-action">Guardar Atleta</button>
                        <button type="button" id="btnCancel" class="btn-cancel" onclick="limparFormulario()">Fechar / Cancelar</button>
                    </form>
                </div>

                <!-- Painel Direito: Listagem com Filtros -->
                <div class="panel right-panel" style="flex: 1;">
                    <div class="panel-header">
                        <h3>Plantel do Escalão</h3>
                    </div>

                    <div class="filters-bar">
                        <div>
                            <label>Filtrar por Posição:</label>
                            <select id="filtroPosicao" onchange="filtrarAtletas()">
                                <option value="">Todas</option>
                                <option value="Guarda-Redes">Guarda-Redes</option>
                                <option value="Fixo">Fixo</option>
                                <option value="Ala">Ala</option>
                                <option value="Pívot">Pívot</option>
                            </select>
                        </div>
                        <div>
                            <label>Procurar Nome:</label>
                            <input type="text" id="filtroNome" placeholder="Nome do atleta..." oninput="filtrarAtletas()">
                        </div>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Foto</th>
                                    <th>Nº</th>
                                    <th>Nome</th>
                                    <th>Posição</th>
                                    <th>Idade</th>
                                    <th>Status</th>
                                    <th>Telemóvel</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaAtletas">
                                <!-- Preenchido dinamicamente via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const API_URL = '/api/atletas';
        let atletasCache = [];
        let escalaoSelecionado = '';

        const escaloesLista = [
            "Petizes", "Traquinas", "Benjamins", "Infantis", 
            "Iniciados", "Juvenis", "Juniores", "Seniores"
        ];

        // Inicializar a aplicação diretamente carregando os escalões na página principal
        window.addEventListener("DOMContentLoaded", () => {
            carregarEscaloesUI();
        });

        function carregarEscaloesUI() {
            const grid = document.getElementById('gridEscaloes');
            grid.innerHTML = '';
            escaloesLista.forEach(esc => {
                const div = document.createElement('div');
                div.className = 'card-escalao';
                div.onclick = () => selecionarEscalao(esc);
                div.innerHTML = `
                    <h3>${esc}</h3>
                    <p>Gerir plantel e atletas</p>
                `;
                grid.appendChild(div);
            });
        }

        function irParaEscaloes() {
            mudarEcras('escalaoScreen');
        }

        function selecionarEscalao(escalao) {
            escalaoSelecionado = escalao;
            document.getElementById('tituloEscalaoAtual').innerText = `Escalão: ${escalao}`;
            mudarEcras('dashboardScreen');
            carregarAtletas();
        }

        function mudarEcras(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        const getBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        function toggleFormulario() {
            const panel = document.getElementById('formPanel');
            panel.classList.toggle('active');
        }

        // READ: Carregar atletas da API filtrando pelo escalão ativo
        async function carregarAtletas() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Erro na resposta da API');
                const todos = await response.json();
                atletasCache = todos.filter(a => a.escalao === escalaoSelecionado);
                renderizarTabela(atletasCache);
            } catch (error) {
                console.error('Erro ao carregar atletas:', error);
            }
        }

        function renderizarTabela(atletas) {
            const tbody = document.getElementById('tabelaAtletas');
            tbody.innerHTML = '';

            if (atletas.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #777;">Nenhum atleta registado neste escalão.</td></tr>`;
                return;
            }

            atletas.forEach(a => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${a.fotoBase64 ? `<img src="${a.fotoBase64}" class="avatar">` : 'Sem foto'}</td>
                    <td><span style="color: #ffcc00; font-weight: bold;">${a.numeroAtleta || ''}</span></td>
                    <td>${a.nome || ''}</td>
                    <td>${a.posicao || ''}</td>
                    <td>${a.idade || ''}</td>
                    <td><span style="color: ${a.status === 'Disponivel' ? '#00ffcc' : '#ff5555'};">${a.status || ''}</span></td>
                    <td>${a.telemovel || ''}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-edit" onclick="prepararEdicao(${a.id})">Editar</button>
                            <button class="btn-delete" onclick="eliminarAtleta(${a.id})">Eliminar</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarAtletas() {
            const posFiltro = document.getElementById('filtroPosicao').value;
            const nomeFiltro = document.getElementById('filtroNome').value.toLowerCase();

            const filtrados = atletasCache.filter(a => {
                const matchPos = posFiltro === "" || a.posicao === posFiltro;
                const matchNome = (a.nome || '').toLowerCase().includes(nomeFiltro);
                return matchPos && matchNome;
            });

            renderizarTabela(filtrados);
        }

        // CREATE & UPDATE
        document.getElementById('atletaForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('atletaId').value;
            let fotoBase64 = null;
            const fileInput = document.getElementById('fotoInput').files[0];
            
            if (fileInput) {
                fotoBase64 = await getBase64(fileInput);
            } else if (id) {
                const atletaExistente = atletasCache.find(a => a.id == id);
                if (atletaExistente) fotoBase64 = atletaExistente.fotoBase64;
            }

            const atleta = {
                nome: document.getElementById('nome').value,
                posicao: document.getElementById('posicao').value,
                escalao: escalaoSelecionado,
                numeroAtleta: parseInt(document.getElementById('numeroAtleta').value) || null,
                idade: parseInt(document.getElementById('idade').value) || null,
                altura: parseFloat(document.getElementById('altura').value) || null,
                peso: parseFloat(document.getElementById('peso').value) || null,
                telemovel: document.getElementById('telemovel').value,
                email: document.getElementById('email').value,
                status: document.getElementById('status').value,
                condicaoFisica: document.getElementById('condicaoFisica').value,
                encarregadoEducacao: document.getElementById('encarregadoEducacao').value,
                telemovelEE: document.getElementById('telemovelEE').value,
                fotoBase64: fotoBase64
            };

            const url = id ? `${API_URL}/${id}` : API_URL;
            const method = id ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(atleta)
            });

            if (response.ok) {
                limparFormulario();
                toggleFormulario();
                carregarAtletas();
            } else {
                alert('Erro ao guardar o atleta na base de dados.');
            }
        });

        function prepararEdicao(id) {
            const atleta = atletasCache.find(a => a.id === id);
            if (!atleta) return;

            document.getElementById('atletaId').value = atleta.id;
            document.getElementById('nome').value = atleta.nome || '';
            document.getElementById('posicao').value = atleta.posicao || 'Ala';
            document.getElementById('numeroAtleta').value = atleta.numeroAtleta || '';
            document.getElementById('idade').value = atleta.idade || '';
            document.getElementById('altura').value = atleta.altura || '';
            document.getElementById('peso').value = atleta.peso || '';
            document.getElementById('telemovel').value = atleta.telemovel || '';
            document.getElementById('email').value = atleta.email || '';
            document.getElementById('status').value = atleta.status || 'Disponivel';
            document.getElementById('condicaoFisica').value = atleta.condicaoFisica || '';
            document.getElementById('encarregadoEducacao').value = atleta.encarregadoEducacao || '';
            document.getElementById('telemovelEE').value = atleta.telemovelEE || '';

            document.getElementById('formTitle').innerText = 'Editar Atleta';
            document.getElementById('btnSubmit').innerText = 'Atualizar Atleta';
            document.getElementById('btnCancel').style.display = 'block';

            const panel = document.getElementById('formPanel');
            if (!panel.classList.contains('active')) {
                panel.classList.add('active');
            }
        }

        function limparFormulario() {
            document.getElementById('atletaForm').reset();
            document.getElementById('atletaId').value = '';
            document.getElementById('formTitle').innerText = 'Inserir Novo Atleta';
            document.getElementById('btnSubmit').innerText = 'Guardar Atleta';
            document.getElementById('btnCancel').style.display = 'none';
            toggleFormulario();
        }

        async function eliminarAtleta(id) {
            if (confirm('Tens a certeza que pretendes eliminar este atleta?')) {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    carregarAtletas();
                } else {
                    alert('Erro ao eliminar o atleta.');
                }
            }
        }
    </script>
</body>
</html>
